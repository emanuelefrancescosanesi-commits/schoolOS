<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sei offline · SchoolOS</title>
<style>
  :root { --bg:#fafafb; --fg:#12141a; --muted:#5f6675; --accent:#4f46e5; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0d12; --fg:#eceef4; --muted:#8b93a7; --accent:#6366f1; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
    padding-bottom:max(24px, env(safe-area-inset-bottom)); background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align:center; }
  main { max-width:22rem; }
  h1 { font-size:1.375rem; margin:0 0 .5rem; }
  p { margin:0 0 1.5rem; color:var(--muted); line-height:1.5; }
  button { min-height:44px; padding:0 1.25rem; border:0; border-radius:10px; background:var(--accent); color:var(--accent-fg);
    font:inherit; font-weight:500; cursor:pointer; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  img { width:56px; height:56px; border-radius:14px; margin-bottom:1rem; }
</style>
</head>
<body>
<main role="main">
  <img src="/icons/icon-192.png" alt="" width="56" height="56">
  <h1>Sei offline</h1>
  <p>Non riesco a collegarmi a internet. I tuoi dati sono al sicuro: appena torni online riprova.</p>
  <button type="button" id="retry">Riprova</button>
</main>
<script>
  document.getElementById("retry").addEventListener("click", function () { location.href = "/dashboard"; });
  window.addEventListener("online", function () { location.href = "/dashboard"; });
</script>
</body>
</html>
