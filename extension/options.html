<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Impostazioni SchoolOS</title>
<style>body{font:15px system-ui,sans-serif;max-width:480px;margin:32px auto;padding:0 16px}
input{width:100%;padding:8px;font:inherit;box-sizing:border-box}button{margin-top:10px;padding:8px 14px;font:inherit}</style></head>
<body><h1>SchoolOS</h1>
<label for="url">Indirizzo della tua app SchoolOS</label>
<input id="url" type="url" placeholder="https://…" />
<button id="save">Salva</button> <span id="ok"></span>
<h2 style="margin-top:28px;font-size:16px">Sincronizzazione automatica</h2>
<p style="color:#555">In SchoolOS: Voti → Importa dal registro → «Collega l'estensione» → crea il codice e incollalo qui. Resta solo su questo browser.</p>
<label for="token">Codice di collegamento</label>
<input id="token" type="text" autocomplete="off" placeholder="sos_…" />
<button id="saveToken">Salva codice</button> <button id="clearToken">Scollega</button> <span id="okToken"></span>
<script src="options.js"></script></body></html>
