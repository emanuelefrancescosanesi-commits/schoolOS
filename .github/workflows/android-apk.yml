name: APK di prova (Android)

# Costruisce un APK di debug installabile sul telefono (senza account Google Play).
# Scaricalo da: Actions → questa esecuzione → Artifacts → schoolos-debug-apk.
on:
  workflow_dispatch:
  pull_request:
    paths: ["android/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: schoolos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
